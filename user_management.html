<!DOCTYPE html><html lang="en" class="dark"><head>
  <!-- Sidebar State Initialization -->
<script>
  (function() {
    if (localStorage.getItem('sidebar_collapsed') === 'true') {
      document.documentElement.classList.add('sidebar-collapsed');
    }
    if (localStorage.getItem('theme') === 'light') {
      document.documentElement.classList.remove('dark');
    }
  })();
</script>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>User Management - Inventaris Gudang 6</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">



<script type="module">
  import { requireAuth } from './src/auth.js';
  requireAuth('admin');
</script>
    <link rel="stylesheet" href="/assets/tailwind.css"/>
</head>
<body class="bg-background text-on-background flex flex-col md:flex-row min-h-screen">

<!-- SideNavBar (Desktop) -->

<div id="main-content" class="flex-1 flex flex-col md:ml-64 relative min-w-0 content-wrapper h-screen">
  <!-- Header -->
  
  <main class="flex-1 overflow-y-auto flex flex-col pb-20 md:pb-0 min-w-0">

  <!-- Page Header Configuration for SPA -->
  <div id="page-header-config" class="hidden">
    <div class="page-title">User Management</div>
    <div class="left-actions"></div>
    <div class="right-actions">
        <button id="btn-add-user" class="flex items-center gap-2 bg-primary-container text-on-primary-container px-4 py-2 rounded-lg font-label-md text-label-md hover:bg-primary-container/90 transition-colors">
            <span class="material-symbols-outlined text-[18px]">add</span> Tambah Pengguna
        </button>
    </div>
  </div>

  <div class="pb-lg pt-6 lg:pt-8 w-full max-w-[1536px] px-4 md:px-6 mx-auto">
  <!-- Data Table Card -->
<div class="glass-panel rounded-2xl p-2 sm:p-4 lg:px-6 lg:py-4 border border-white/10 relative overflow-hidden flex flex-col custom-scrollbar">
<!-- Responsive Table Wrapper -->
<div class="overflow-x-auto w-full max-h-[65vh] pb-4 custom-scrollbar">
<table class="w-full text-left border-collapse min-w-[800px]">
<thead class="sticky top-0 z-20 bg-surface-container-lowest">
<tr class="border-b border-surface-variant text-on-surface-variant">
<th class="py-3 px-4 font-label-md uppercase tracking-wider">ID Staf</th>
<th class="py-3 px-4 font-label-md uppercase tracking-wider">Nama Lengkap</th>
<th class="py-3 px-4 font-label-md uppercase tracking-wider">Role</th>
<th class="py-3 px-4 font-label-md uppercase tracking-wider">Dibuat Pada</th>
<th class="py-3 px-4 font-label-md uppercase tracking-wider text-right">Aksi</th>
</tr>
</thead>
<tbody id="user-table-body" class="font-body-md text-body-md text-on-surface divide-y divide-surface-variant">
    <tr>
        <td colspan="5" class="py-8 text-center text-on-surface-variant">
            <span class="material-symbols-outlined animate-spin text-[24px] mb-2">progress_activity</span>
            <p>Memuat data...</p>
        </td>
    </tr>
</tbody>
</table>
</div>
</div>
</div>

  <!-- Modal Add User -->
  <div id="modal-add-user" class="fixed inset-0 z-50 flex items-center justify-center hidden">
    <div id="modal-backdrop" class="absolute inset-0 bg-black/60 backdrop-blur-sm transition-opacity opacity-0"></div>
    <div id="modal-content" class="bg-surface-container-high w-full max-w-md rounded-2xl border border-white/10 shadow-2xl p-6 relative z-10 scale-95 opacity-0 transition-all duration-300">
      <h2 class="text-title-lg font-bold text-on-surface mb-6">Tambah Pengguna Baru</h2>
      <form id="form-add-user" class="space-y-4">
        <div id="add-user-error" class="hidden bg-error/20 text-error px-4 py-3 rounded-xl text-label-md font-medium border border-error/30"></div>
        
        <div>
          <label class="block text-label-sm font-medium text-on-surface-variant mb-1">ID Staf (Sesuai ID Card)</label>
          <input type="text" id="input-id-number" required minlength="7" class="w-full bg-surface-container-low border border-white/10 rounded-xl px-4 py-2.5 text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" placeholder="Ketik ID Staf...">
        </div>
        <div>
          <label class="block text-label-sm font-medium text-on-surface-variant mb-1">Nama Lengkap</label>
          <input type="text" id="input-nama" required class="w-full bg-surface-container-low border border-white/10 rounded-xl px-4 py-2.5 text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" placeholder="Ketik nama lengkap...">
        </div>
        <div>
          <label class="block text-label-sm font-medium text-on-surface-variant mb-1">Role</label>
          <select id="input-role" required class="w-full bg-surface-container-low border border-white/10 rounded-xl px-4 py-2.5 text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors">
            <option value="staf">Staf</option>
            <option value="admin">Admin</option>
          </select>
        </div>
        <div>
          <label class="block text-label-sm font-medium text-on-surface-variant mb-1">Password</label>
          <input type="password" id="input-password" required minlength="6" class="w-full bg-surface-container-low border border-white/10 rounded-xl px-4 py-2.5 text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" placeholder="Min. 6 karakter">
        </div>
        
        <div class="flex gap-3 pt-4 mt-6 border-t border-white/10">
          <button type="button" id="btn-cancel-user" class="flex-1 py-2.5 rounded-xl border border-white/10 text-on-surface hover:bg-surface-container transition-colors font-label-md">Batal</button>
          <button type="submit" id="btn-save-user" class="flex-1 py-2.5 rounded-xl bg-primary text-on-primary hover:bg-primary/90 transition-colors font-label-md font-semibold flex items-center justify-center gap-2">
            <span>Simpan</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Reset Password -->
  <div id="modal-reset-password" class="fixed inset-0 z-50 flex items-center justify-center hidden">
    <div id="modal-backdrop-reset" class="absolute inset-0 bg-black/60 backdrop-blur-sm transition-opacity opacity-0"></div>
    <div id="modal-content-reset" class="bg-surface-container-high w-full max-w-md rounded-2xl border border-white/10 shadow-2xl p-6 relative z-10 scale-95 opacity-0 transition-all duration-300">
      <h2 class="text-title-lg font-bold text-on-surface mb-2">Reset Password</h2>
      <p class="text-label-md text-on-surface-variant mb-6">Reset password untuk <strong id="reset-target-name" class="text-on-surface"></strong>.</p>
      <form id="form-reset-password" class="space-y-4">
        <input type="hidden" id="input-reset-uid">
        <div id="reset-password-error" class="hidden bg-error/20 text-error px-4 py-3 rounded-xl text-label-md font-medium border border-error/30"></div>
        
        <div>
          <label class="block text-label-sm font-medium text-on-surface-variant mb-1">Password Baru</label>
          <input type="password" id="input-new-password" required minlength="6" class="w-full bg-surface-container-low border border-white/10 rounded-xl px-4 py-2.5 text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" placeholder="Masukkan password baru">
        </div>
        
        <div class="flex gap-3 pt-4 mt-6 border-t border-white/10">
          <button type="button" id="btn-cancel-reset" class="flex-1 py-2.5 rounded-xl border border-white/10 text-on-surface hover:bg-surface-container transition-colors font-label-md">Batal</button>
          <button type="submit" id="btn-save-reset" class="flex-1 py-2.5 rounded-xl bg-primary text-on-primary hover:bg-primary/90 transition-colors font-label-md font-semibold flex items-center justify-center gap-2">
            <span>Reset</span>
          </button>
        </div>
      </form>
    </div>
  </div>
  
  <!-- Modal Change Role -->
  <div id="modal-change-role" class="fixed inset-0 z-50 flex items-center justify-center hidden">
    <div id="modal-backdrop-role" class="absolute inset-0 bg-black/60 backdrop-blur-sm transition-opacity opacity-0"></div>
    <div id="modal-content-role" class="bg-surface-container-high w-full max-w-md rounded-2xl border border-white/10 shadow-2xl p-6 relative z-10 scale-95 opacity-0 transition-all duration-300">
      <h2 class="text-title-lg font-bold text-on-surface mb-2">Ubah Role Pengguna</h2>
      <p class="text-label-md text-on-surface-variant mb-6">Apakah Anda yakin ingin mengubah role <strong id="role-target-name" class="text-on-surface"></strong> menjadi <strong id="role-target-new" class="text-primary"></strong>?</p>
      <form id="form-change-role" class="space-y-4">
        <input type="hidden" id="input-role-uid">
        <input type="hidden" id="input-role-new">
        <div id="change-role-error" class="hidden bg-error/20 text-error px-4 py-3 rounded-xl text-label-md font-medium border border-error/30"></div>
        
        <div class="flex gap-3 pt-4 mt-6 border-t border-white/10">
          <button type="button" id="btn-cancel-role" class="flex-1 py-2.5 rounded-xl border border-white/10 text-on-surface hover:bg-surface-container transition-colors font-label-md">Batal</button>
          <button type="submit" id="btn-save-role" class="flex-1 py-2.5 rounded-xl bg-primary text-on-primary hover:bg-primary/90 transition-colors font-label-md font-semibold flex items-center justify-center gap-2">
            <span>Ubah Role</span>
          </button>
        </div>
      </form>
    </div>
  </div>
</main></div>


<!-- Decorative Floating Action Button (Mobile Contextual - Only if needed, suppressed per instructions for general dashboard, but keeping a subtle hint if required by future logic. Omitted here for cleaner dashboard canvas as per standard iOS style unless specific action is paramount). -->

<script type="module" src="/src/upload.js"></script>
<script type="module" src="/src/userManagement.js"></script>

<script type="module">
  import { logout } from './src/auth.js';
  document.getElementById('btn-logout')?.addEventListener('click', () => {
    logout();
  });
</script>



  <script type="module" src="/src/components/Navigation.js"></script>
</body></html>
