<!DOCTYPE html>

<html lang="en" class="dark"><head>
<script>
  // Theme: apply saved preference instantly to prevent flash
  if (localStorage.getItem('theme') === 'light') {
    document.documentElement.classList.remove('dark');
  }
</script>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Inventaris Gudang 6 - Login</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>

<style>
  body *:not(.material-symbols-outlined) {
    font-size: 13px !important;
  }
</style>

    <link rel="stylesheet" href="/assets/tailwind.css"/>
  <script type="module" crossorigin src="/assets/main-CDY-9le8.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/auth-B0Je9VhP.js">
</head>
<body class="min-h-screen bg-cover bg-center bg-no-repeat font-body-md text-white antialiased flex flex-col justify-center relative overflow-hidden" style="background-image: url('/assets/login_bg.png');">
<div class="absolute inset-0 bg-black/10 pointer-events-none"></div>

<main class="w-full max-w-[340px] mx-auto lg:mx-0 lg:ml-[12%] relative z-10">
<div class="backdrop-blur-xl bg-white/10 rounded-[24px] p-8 border border-white/20 shadow-2xl relative overflow-hidden flex flex-col">
<h1 class="text-[24px] font-semibold text-white tracking-tight mb-1">Hi, Admin!</h1>
<p class="text-white/80 text-[13px] mb-6">Check-in to Dashboard</p>

<form id="login-form" class="flex flex-col w-full gap-2.5">
<div>
<input class="w-full px-3 py-2.5 rounded-md bg-white border-none text-gray-900 placeholder-gray-400 focus:ring-2 focus:ring-primary/50 transition-all text-[13px] outline-none shadow-sm" id="id-number" name="email" placeholder="Number (ID / Email)" required="" type="text"/>
</div>
<div class="relative">
<input class="w-full px-3 py-2.5 pr-10 rounded-md bg-white border-none text-gray-900 placeholder-gray-400 focus:ring-2 focus:ring-primary/50 transition-all text-[13px] outline-none shadow-sm" id="password" name="password" placeholder="Password" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 transition-colors" type="button">
<span class="material-symbols-outlined text-[16px]">visibility_off</span>
</button>
</div>

<button id="btn-submit" class="mt-1 w-full bg-[#18181b] hover:bg-black text-white font-medium text-[13px] py-2.5 rounded-md shadow-md transition-all active:scale-[0.98] flex items-center justify-center" type="submit">
Login
</button>
</form>

<div id="error-msg" class="hidden text-error text-[12px] bg-red-500/20 px-3 py-2 rounded-md text-center font-medium mt-3"></div>

<!-- OR divider -->
<div class="flex items-center my-4 opacity-70">
<div class="flex-grow h-px bg-white/30"></div>
<span class="px-3 text-white/70 text-[10px] font-medium uppercase tracking-widest">or</span>
<div class="flex-grow h-px bg-white/30"></div>
</div>

<!-- Social Login -->
<button id="btn-google" type="button" class="w-full bg-white hover:bg-gray-50 text-gray-900 font-medium text-[13px] py-2.5 rounded-md shadow-sm transition-all active:scale-[0.98] flex items-center justify-center gap-2">
<img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" class="w-4 h-4"/>
Sign in with Google
</button>

</div>
</main>
<script>
        document.querySelector('button[aria-label="Toggle password visibility"]').addEventListener('click', function() {
            const input = document.getElementById('password');
            const icon = this.querySelector('.material-symbols-outlined');
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility';
            } else {
                input.type = 'password';
                icon.textContent = 'visibility_off';
            }
        });
</script>
</body></html>
